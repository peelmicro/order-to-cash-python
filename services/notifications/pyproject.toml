[project]
name = "otc-notifications"
version = "0.1.0"
description = "otc-notifications"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "otc-shared-kernel",
    "otc-contracts",
    "otc-cqrs",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "aiokafka>=0.14.0",
    "aiosmtplib>=5.1.3",
    "structlog>=26.1.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
otc-shared-kernel = { workspace = true }
otc-contracts = { workspace = true }
otc-cqrs = { workspace = true }
