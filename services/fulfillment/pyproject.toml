[project]
name = "otc-fulfillment"
version = "0.1.0"
description = "otc-fulfillment"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "otc-shared-kernel",
    "otc-contracts",
    "otc-cqrs",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
otc-shared-kernel = { workspace = true }
otc-contracts = { workspace = true }
otc-cqrs = { workspace = true }
