[project]
name = "otc-seed"
version = "0.1.0"
description = "otc-seed"
requires-python = ">=3.14,<3.15"
dependencies = [
    "otc-shared-kernel",
    "otc-contracts",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.31.0",
    "pymongo>=4.18.2",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
otc-shared-kernel = { workspace = true }
otc-contracts = { workspace = true }
