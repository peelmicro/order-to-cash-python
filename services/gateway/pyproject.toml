[project]
name = "otc-gateway"
version = "0.1.0"
description = "otc-gateway"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "otc-shared-kernel",
    "otc-contracts",
    "otc-cqrs",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.2",
    "nats-py>=2.16.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
otc-shared-kernel = { workspace = true }
otc-contracts = { workspace = true }
otc-cqrs = { workspace = true }
