      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/rpcCorrelationId'
      headers:
        $ref: '#/components/schemas/RpcHeaders'
      payload:
        $ref: '#/components/schemas/RpcError'
      tags:
