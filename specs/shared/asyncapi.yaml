  schemas:
    # ───────────────────────── shared kernel primitives ──────────────────────
    UniqueId:
      type: string
      format: uuid
      description: An opaque, globally unique identifier generated inside the domain, never by a store.
      examples:
        - 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f

    Instant:
      type: string
      format: date-time
      description: A UTC instant, ISO-8601 on the wire, stamped through a clock port.
      examples:
        - '2026-08-18T10:15:00.000Z'

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 alpha-3 code of a seeded currency.
      examples:
        - EUR
        - GBP
        - USD

    MinorUnits:
      type: integer
      format: int64
      description: |
        An amount as a whole count of the currency's smallest denomination
        (cents for EUR/GBP/USD). **Never** a decimal, float or major-unit value.
        `€1,242.50` is `124250`. Used where the enclosing object already
        declares its `currency`; where an amount travels alone, use `Money`.
        The `.99` simulator predicate (R42) reads `totalAmount mod 100 = 99`,
        which is only well defined on this representation.
      examples:
        - 124250

    Money:
      type: object
      description: An amount that travels alone — integer minor units plus its currency.
      properties:
        amount:
          $ref: '#/components/schemas/MinorUnits'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
        - amount
        - currency
      examples:
        - amount: 124250
          currency: EUR

    Gln:
      type: string
      pattern: '^[0-9]{13}$'
      description: |
        Global Location Number — exactly 13 decimal digits whose final digit is
        the GS1 mod-10 check digit over the preceding twelve (R4). The pattern
        cannot express the check digit; it is a domain rule, validated on
        construction.
      examples:
        - '8412345000013'

    Quantity:
      type: integer
      minimum: 1
      description: A strictly positive whole count of units. Zero, negative and fractional quantities do not exist in this model (R3).

    UnitCount:
      type: integer
      minimum: 0
      description: A non-negative whole count of units (on-hand, reserved, available).

    OrderReference:
      type: string
      pattern: '^ORD-[0-9]{6,}$'
      description: Human-readable, unique, immutable business reference of an order.
      examples:
        - ORD-000042

    DespatchReference:
      type: string
      pattern: '^DES-[0-9]{6,}$'
      examples:
        - DES-000031

    InvoiceReference:
      type: string
      pattern: '^INV-[0-9]{6,}$'
      examples:
        - INV-000027

    CreditCode:
      type: string
      pattern: '^CR-[0-9]{6,}$'
      examples:
        - CR-000004

    PartyCode:
      type: string
      minLength: 1
      maxLength: 20
      description: Business identifier of a retailer (buyer) or company (supplier). Contexts reference each other by this, never by another context's internal id.
      examples:
        - CarrefourEs

    ProductCode:
      type: string
      minLength: 1
      maxLength: 30
      examples:
        - PRD-0001

    PaymentReference:
      type: string
      minLength: 1
      maxLength: 30
      description: The idempotency key of the remittance intake (R48, invariant B10).
      examples:
        - PAY-2026-08-18-000019

    PartyRef:
      type: object
      description: A party as it appears in a read view — business code, display name and GLN. Named identically in `openapi.yaml`.
      properties:
        code:
          $ref: '#/components/schemas/PartyCode'
        name:
          type: string
        gln:
          $ref: '#/components/schemas/Gln'
      required:
        - code
        - gln

    OrderStatus:
      type: string
      enum:
        - placed
        - stock_reserved
        - credit_approved
        - confirmed
        - despatched
        - invoiced
        - paid
        - completed
        - cancelled
      description: The `Order` state machine of `domain-model.md` §3.3, which is also the saga state. `completed` and `cancelled` are terminal.

    CancellationReason:
      type: string
      enum:
        - stock_rejected
        - credit_rejected
        - operator_cancelled

    InvoiceStatus:
      type: string
      enum:
        - issued
        - paid

    ReservationStatus:
      type: string
      enum:
        - reserved
        - released
        - consumed

    PaymentSource:
      type: string
      enum:
        - operator
        - robot
        - test
      description: Provenance of a remittance. Carries no rule; it exists so a demo can tell an operator click from the external payment robot.

    OrderLine:
      type: object
      description: One line of an order. `unitPrice` and `lineDiscount` are minor units in the order's currency, snapshotted at order time.
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        description:
          type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        unitPrice:
          $ref: '#/components/schemas/MinorUnits'
        lineDiscount:
          $ref: '#/components/schemas/MinorUnits'
      required:
        - productCode
        - quantity
        - unitPrice
        - lineDiscount

    ReservationRef:
      type: object
      properties:
        reservationId:
          $ref: '#/components/schemas/UniqueId'
        productCode:
          $ref: '#/components/schemas/ProductCode'
        units:
          $ref: '#/components/schemas/Quantity'
      required:
        - reservationId
        - productCode
        - units

    Shortage:
      type: object
      description: One line that could not be satisfied, with what was asked for and what was free.
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        requested:
          $ref: '#/components/schemas/Quantity'
        available:
          $ref: '#/components/schemas/UnitCount'
      required:
        - productCode
        - requested
        - available

    DespatchLine:
      type: object
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        units:
          $ref: '#/components/schemas/Quantity'
      required:
        - productCode
        - units

    InvoiceLine:
      type: object
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        units:
          $ref: '#/components/schemas/Quantity'
        unitPrice:
          $ref: '#/components/schemas/MinorUnits'
      required:
        - productCode
        - units
        - unitPrice

    CompensationStep:
      type: object
      description: One compensating action that ran before the cancellation, so the unwinding is auditable in causal order.
      properties:
        step:
          type: string
          enum:
            - stock_released
            - credit_released
        eventId:
          $ref: '#/components/schemas/UniqueId'
        eventType:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Instant'
        summary:
          type: string
      required:
        - step
        - eventType
        - occurredAt

    # ───────────────────────────── the envelope ─────────────────────────────
    Envelope:
      type: object
      title: Fact envelope
      description: |
        The payload-independent contract carried by **every** fact, identical
        across the trilogy (R11, R12). No field may be absent, null or empty.
        Each of the fourteen fact schemas composes this with a `const`
        `eventType` and its own `payload`.
      properties:
        eventId:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: Globally unique. **The idempotency key of every consumer**, generated in the domain when the event is created, not when it is published.
        eventType:
          type: string
          pattern: '^[a-z]+\.[a-z_]+\.v[0-9]+$'
          description: '`<aggregate>.<fact>.v<n>`. The version suffix is part of the type: a breaking payload change is a new `v<n+1>` type carried alongside the old one.'
        aggregateId:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: Identity of the aggregate that produced the fact — the order, the stock item, the credit line, the invoice.
        correlationId:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: '**Always the order id.** Partition key of the fact stream, log correlation id and read-model document key.'
        causationId:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: The `eventId` of the fact — or the id of the command — that caused this one, so the causal chain is reconstructible from the facts alone.
        occurredAt:
          allOf:
            - $ref: '#/components/schemas/Instant'
          description: When the fact **became true in the domain**, stamped by the aggregate — not when it was published or consumed. Timelines order by this, never by arrival (R50).
        payload:
          type: object
          description: The fact-specific body. All monetary fields are integer minor units.
      required:
        - eventId
        - eventType
        - aggregateId
        - correlationId
        - causationId
        - occurredAt
        - payload

    FactHeaders:
      type: object
      description: Transport headers carried by every fact. Trace context is mandatory so one distributed trace spans both brokers (R56, R57).
      properties:
        traceparent:
          type: string
          description: W3C trace context, injected on publish and extracted on consume.
        tracestate:
          type: string
        x-event-type:
          type: string
          description: Mirror of the envelope's `eventType`, so a consumer can filter without deserialising the payload (the cost of topic-per-service rather than topic-per-event).
        content-type:
          type: string
          default: application/json
      required:
        - traceparent
        - x-event-type

    DeadLetterHeaders:
      type: object
      description: |
        Diagnostic headers of a dead-letter record. The payload stays the
        unmodified original envelope so a redrive is a byte-for-byte republish;
        everything about the failure lives here.

        `x-first-failed-at` is the instant the FIRST processing attempt failed —
        never the instant processing began; it equals `x-failed-at` only when a
        single attempt was made. `x-failed-at` is the instant the final attempt
        failed, immediately before the record was dead-lettered.
      properties:
        x-failed-consumer:
          type: string
          description: Name of the consumer that exhausted its attempts — `orders.saga`, `projector` or `notifications`.
          examples:
            - projector
        x-attempts:
          type: integer
          minimum: 1
          description: How many processing attempts were made before giving up.
        x-error:
          type: string
          description: The error of the final attempt — class or code plus message. Stack traces belong in logs, not here.
        x-original-topic:
          type: string
          description: The source topic, so a redrive knows where to republish.
        x-first-failed-at:
          $ref: '#/components/schemas/Instant'
        x-failed-at:
          $ref: '#/components/schemas/Instant'
        traceparent:
          type: string
        x-event-type:
          type: string
      required:
        - x-failed-consumer
        - x-attempts
        - x-error

