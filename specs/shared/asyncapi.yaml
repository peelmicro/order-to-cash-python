      name: order.saga_failed.v1
      title: Saga command dead-lettered
      summary: A saga command exhausted its in-line retries and parked; the order stays in its last legal status.
      description: |
        Emitted by Orders, at most once per `saga_commands` row, on the first
        transition into `parked` (R29's dead-letter clause, OR3) — never on a
        later re-park of the same row. Purely diagnostic: no aggregate
        invariant depends on it, and `SO5`'s indefinite capped-backoff retry
        of the underlying command is unaffected by its emission.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/OrderSagaFailedEvent'
      bindings:
