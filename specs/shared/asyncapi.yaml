        $ref: '#/components/messages/RpcErrorReply'

  despatchCreate:
    address: fulfillment.despatch.create
    title: fulfillment.despatch.create — request
    summary: Create the despatch advice (DESADV). Caller — orders.saga. Responder — fulfillment.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/DespatchCreateRequest'
  despatchCreateReply:
    address: null
    title: fulfillment.despatch.create — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/DespatchCreateReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  creditHold:
    address: billing.credit.hold
    title: billing.credit.hold — request
    summary: Credit check and hold for the order total. Caller — orders.saga. Responder — billing.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/CreditHoldRequest'
  creditHoldReply:
