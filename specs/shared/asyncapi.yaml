operations:
  # ─────────────────────── fact production (outbox relay) ───────────────────
  publishOrdersFacts:
    action: send
    title: Orders publishes its facts
    channel:
      $ref: '#/channels/ordersFacts'
    description: |
      Published **only** by the Orders outbox relay, after the aggregate and its
      outbox records were committed in one transaction (R13, R14). No aggregate,
      command handler or domain service publishes directly.
    messages:
      - $ref: '#/channels/ordersFacts/messages/orderPlaced'
      - $ref: '#/channels/ordersFacts/messages/orderConfirmed'
      - $ref: '#/channels/ordersFacts/messages/orderCompleted'
      - $ref: '#/channels/ordersFacts/messages/orderCancelled'

  publishFulfillmentFacts:
    action: send
    title: Fulfillment publishes its facts
    channel:
      $ref: '#/channels/fulfillmentFacts'
    description: Published only by the Fulfillment outbox relay (R13, R14).
    messages:
      - $ref: '#/channels/fulfillmentFacts/messages/stockReserved'
      - $ref: '#/channels/fulfillmentFacts/messages/stockRejected'
      - $ref: '#/channels/fulfillmentFacts/messages/stockReleased'
      - $ref: '#/channels/fulfillmentFacts/messages/orderDespatched'

  publishBillingFacts:
    action: send
    title: Billing publishes its facts
    channel:
      $ref: '#/channels/billingFacts'
    description: Published only by the Billing outbox relay (R13, R14).
    messages:
      - $ref: '#/channels/billingFacts/messages/creditApproved'
      - $ref: '#/channels/billingFacts/messages/creditRejected'
      - $ref: '#/channels/billingFacts/messages/creditReleased'
      - $ref: '#/channels/billingFacts/messages/invoiceIssued'
      - $ref: '#/channels/billingFacts/messages/paymentReceived'

  # ─────────────────────────── fact consumption ─────────────────────────────
  sagaConsumesOrdersFacts:
    action: receive
    title: Saga orchestrator consumes orders facts
    channel:
      $ref: '#/channels/ordersFacts'
    summary: Consumer name — orders.saga.
    description: |
      The orchestrator acts on `order.placed.v1` only (R19): it issues
      `fulfillment.stock.reserve` and leaves the order in `placed` until the
      resulting **fact** arrives. It deliberately ignores `order.confirmed.v1`,
      `order.completed.v1` and `order.cancelled.v1` — it produced them, and
      consuming them would be a loop.
    messages:
      - $ref: '#/channels/ordersFacts/messages/orderPlaced'

  sagaConsumesFulfillmentFacts:
    action: receive
    title: Saga orchestrator consumes fulfillment facts
    channel:
      $ref: '#/channels/fulfillmentFacts'
    summary: Consumer name — orders.saga.
    description: |
      - `stock.reserved.v1` + status `placed` → `stock_reserved`, issue
        `billing.credit.hold` (R20).
      - `stock.rejected.v1` + status `placed` → `cancelled` (`stock_rejected`),
        and **no release command** is issued (R26).
      - `stock.released.v1` + status `stock_reserved` → `cancelled`
        (`credit_rejected`) — compensation step 2 (R28).
      - `order.despatched.v1` + status `confirmed` → `despatched`, issue
        `billing.invoice.issue` (R22).

      Any fact whose precondition is unmet changes nothing and is recorded as
      ignored (R25).
    messages:
      - $ref: '#/channels/fulfillmentFacts/messages/stockReserved'
      - $ref: '#/channels/fulfillmentFacts/messages/stockRejected'
      - $ref: '#/channels/fulfillmentFacts/messages/stockReleased'
      - $ref: '#/channels/fulfillmentFacts/messages/orderDespatched'

  sagaConsumesBillingFacts:
    action: receive
    title: Saga orchestrator consumes billing facts
    channel:
      $ref: '#/channels/billingFacts'
    summary: Consumer name — orders.saga.
    description: |
      - `credit.approved.v1` + status `stock_reserved` → `credit_approved` →
        `confirmed`, emit exactly one `order.confirmed.v1`, issue
        `fulfillment.despatch.create` (R21).
      - `credit.rejected.v1` + status `stock_reserved` → issue
        `fulfillment.stock.release`; **the order stays `stock_reserved`** until
        `stock.released.v1` arrives (R27).
      - `invoice.issued.v1` + status `despatched` → `invoiced`, no further
        command; the saga now waits for the outside world (R23).
      - `payment.received.v1` + status `invoiced` → `paid` (R24).
      - `credit.released.v1` + status `paid` → `completed`, emit exactly one
        `order.completed.v1` (R24).
    messages:
      - $ref: '#/channels/billingFacts/messages/creditApproved'
      - $ref: '#/channels/billingFacts/messages/creditRejected'
      - $ref: '#/channels/billingFacts/messages/creditReleased'
      - $ref: '#/channels/billingFacts/messages/invoiceIssued'
      - $ref: '#/channels/billingFacts/messages/paymentReceived'

  projectorConsumesOrdersFacts:
    action: receive
    title: Projector consumes orders facts
    channel:
      $ref: '#/channels/ordersFacts'
    summary: Consumer name — projector.
    description: &projectorDescription |
      The projector consumes **all fourteen** facts and is the **sole writer**
      of the read model (R54). For each fact it appends a timeline entry keyed
      by `correlationId`, ordered by `occurredAt` (R50), skips an `eventId`
      already present (R51), never regresses the document status on
      out-of-order delivery (R52), and creates a placeholder document when a
      fact outruns `order.placed.v1` (R53). `order.saga_failed.v1` renders as
      a diagnostic timeline entry only — it changes no document status field
      (R29's dead-letter clause / OR3).
    messages:
      - $ref: '#/channels/ordersFacts/messages/orderPlaced'
      - $ref: '#/channels/ordersFacts/messages/orderConfirmed'
      - $ref: '#/channels/ordersFacts/messages/orderCompleted'
      - $ref: '#/channels/ordersFacts/messages/orderCancelled'
      - $ref: '#/channels/ordersFacts/messages/orderSagaFailed'

  projectorConsumesFulfillmentFacts:
    action: receive
    title: Projector consumes fulfillment facts
    channel:
      $ref: '#/channels/fulfillmentFacts'
    summary: Consumer name — projector.
    description: *projectorDescription
    messages:
      - $ref: '#/channels/fulfillmentFacts/messages/stockReserved'
      - $ref: '#/channels/fulfillmentFacts/messages/stockRejected'
      - $ref: '#/channels/fulfillmentFacts/messages/stockReleased'
      - $ref: '#/channels/fulfillmentFacts/messages/orderDespatched'

  projectorConsumesBillingFacts:
    action: receive
    title: Projector consumes billing facts
    channel:
      $ref: '#/channels/billingFacts'
    summary: Consumer name — projector.
    description: *projectorDescription
    messages:
      - $ref: '#/channels/billingFacts/messages/creditApproved'
      - $ref: '#/channels/billingFacts/messages/creditRejected'
      - $ref: '#/channels/billingFacts/messages/creditReleased'
      - $ref: '#/channels/billingFacts/messages/invoiceIssued'
      - $ref: '#/channels/billingFacts/messages/paymentReceived'

  notificationsConsumeOrdersFacts:
    action: receive
    title: Notifications consumes orders facts
    channel:
      $ref: '#/channels/ordersFacts'
    summary: Consumer name — notifications.
    description: &notificationsDescription |
      Notifications consumes exactly seven of the fourteen facts:
      `order.placed.v1`, `order.confirmed.v1`, `order.despatched.v1`,
      `invoice.issued.v1`, `payment.received.v1`, `order.completed.v1`,
      `order.cancelled.v1`.

      It deliberately does **not** notify on `stock.*` and `credit.*`: those are
      internal saga mechanics, not events a counterparty should be told about.
      The compensation *outcome* reaches them as `order.cancelled.v1` carrying
      its `cancellationReason`. One delivery per (`eventId`, `notifications`)
      regardless of redelivery (R17, R18).
    messages:
      - $ref: '#/channels/ordersFacts/messages/orderPlaced'
      - $ref: '#/channels/ordersFacts/messages/orderConfirmed'
      - $ref: '#/channels/ordersFacts/messages/orderCompleted'
      - $ref: '#/channels/ordersFacts/messages/orderCancelled'

  notificationsConsumeFulfillmentFacts:
    action: receive
    title: Notifications consumes fulfillment facts
    channel:
      $ref: '#/channels/fulfillmentFacts'
    summary: Consumer name — notifications.
    description: *notificationsDescription
    messages:
      - $ref: '#/channels/fulfillmentFacts/messages/orderDespatched'

  notificationsConsumeBillingFacts:
    action: receive
    title: Notifications consumes billing facts
    channel:
      $ref: '#/channels/billingFacts'
    summary: Consumer name — notifications.
    description: *notificationsDescription
    messages:
      - $ref: '#/channels/billingFacts/messages/invoiceIssued'
      - $ref: '#/channels/billingFacts/messages/paymentReceived'

  # ────────────────────────────── dead letters ──────────────────────────────
  publishOrdersFactsDlq:
    action: send
    title: Retry handler dead-letters an orders fact
    channel:
      $ref: '#/channels/ordersFactsDlq'
    description: &dlqOperationDescription |
      After the configured maximum attempts, the failing consumer's retry
      handler republishes the **unmodified** envelope here with the diagnostic
      headers, then acknowledges the original so the partition is not blocked
      (R16). The saga additionally records a saga-failure entry in the order
      timeline and leaves the order in its last legal status (R29).
    messages:
      - $ref: '#/channels/ordersFactsDlq/messages/deadLetterRecord'

  publishFulfillmentFactsDlq:
    action: send
    title: Retry handler dead-letters a fulfillment fact
    channel:
      $ref: '#/channels/fulfillmentFactsDlq'
    description: *dlqOperationDescription
    messages:
      - $ref: '#/channels/fulfillmentFactsDlq/messages/deadLetterRecord'

  publishBillingFactsDlq:
    action: send
    title: Retry handler dead-letters a billing fact
    channel:
      $ref: '#/channels/billingFactsDlq'
    description: *dlqOperationDescription
    messages:
      - $ref: '#/channels/billingFactsDlq/messages/deadLetterRecord'

  inspectOrdersFactsDlq:
    action: receive
    title: Operator inspects the orders dead-letter topic
    channel:
      $ref: '#/channels/ordersFactsDlq'
    description: &dlqInspectDescription |
      No service subscribes automatically. Dead letters are read by a human
      through the broker console; a redrive republishes the payload byte-for-byte
      onto the source topic once the cause is fixed.
    messages:
      - $ref: '#/channels/ordersFactsDlq/messages/deadLetterRecord'

  inspectFulfillmentFactsDlq:
    action: receive
    title: Operator inspects the fulfillment dead-letter topic
    channel:
      $ref: '#/channels/fulfillmentFactsDlq'
    description: *dlqInspectDescription
    messages:
      - $ref: '#/channels/fulfillmentFactsDlq/messages/deadLetterRecord'

  inspectBillingFactsDlq:
    action: receive
    title: Operator inspects the billing dead-letter topic
    channel:
      $ref: '#/channels/billingFactsDlq'
    description: *dlqInspectDescription
    messages:
      - $ref: '#/channels/billingFactsDlq/messages/deadLetterRecord'

  # ─────────────────────────── RPC request-reply ────────────────────────────
  requestOrdersCreate:
    action: send
    title: orders.create
    summary: Caller — gateway. Responder — orders.
    channel:
      $ref: '#/channels/ordersCreate'
    description: |
      Places an order. The responder validates the lines, calls
      `fulfillment.stock.check` (a non-locking read — R31), computes the totals
      inside the aggregate (R6) and, **in one transaction**, persists the
      `Order` in status `placed` together with the `order.placed.v1` outbox
      record (R13). The reply carries the order id, which is also the saga
      `correlationId`.

      Idempotency: by `requestId` when supplied. Rejections are business
      outcomes, not transport errors: `STOCK_UNAVAILABLE` names the short lines.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/ordersCreateReply'
      messages:
        - $ref: '#/channels/ordersCreateReply/messages/success'
        - $ref: '#/channels/ordersCreateReply/messages/error'
    messages:
      - $ref: '#/channels/ordersCreate/messages/request'

  requestOrdersCancel:
    action: send
    title: orders.cancel
    summary: Caller — gateway. Responder — orders.
    channel:
      $ref: '#/channels/ordersCancel'
    description: |
      Operator cancellation, legal only from `placed`, `stock_reserved`,
      `credit_approved` or `confirmed` (R8). The responder unwinds only the
      acquisitions that actually succeeded (`saga.md` §4.3) — from
      `credit_approved` or `confirmed` the stock reservation first, then the
      credit hold, because the despatch requested on confirmation may still
      consume that stock; if it does, the cancellation is overtaken.
      From `despatched` onwards the reply is `ORDER_NOT_CANCELLABLE`.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/ordersCancelReply'
      messages:
        - $ref: '#/channels/ordersCancelReply/messages/success'
        - $ref: '#/channels/ordersCancelReply/messages/error'
    messages:
      - $ref: '#/channels/ordersCancel/messages/request'

  requestStockCheck:
    action: send
    title: fulfillment.stock.check
    summary: Caller — orders (acceptance, not the saga). Responder — fulfillment.
    channel:
      $ref: '#/channels/stockCheck'
    description: |
      A **non-locking read**. It mutates no stock item and emits no fact (R31),
      and it is explicitly **not** a reservation: another order may consume the
      units before `fulfillment.stock.reserve` runs. That race is real and
      intentional — it is why the saga and its compensation exist.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/stockCheckReply'
      messages:
        - $ref: '#/channels/stockCheckReply/messages/success'
        - $ref: '#/channels/stockCheckReply/messages/error'
    messages:
      - $ref: '#/channels/stockCheck/messages/request'

  requestStockReserve:
    action: send
    title: fulfillment.stock.reserve
    summary: Caller — orders.saga. Responder — fulfillment.
    channel:
      $ref: '#/channels/stockReserve'
    description: |
      **All-or-nothing** (invariant F3): either every line is reserved and
      `stock.reserved.v1` is emitted (R32), or nothing is reserved and
      `stock.rejected.v1` names the short lines (R33). Idempotent by
      (`orderReference`, `reserve`): a repeat returns the existing reservations
      with `outcome: already_reserved` and emits no second fact.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/stockReserveReply'
      messages:
        - $ref: '#/channels/stockReserveReply/messages/success'
        - $ref: '#/channels/stockReserveReply/messages/error'
    messages:
      - $ref: '#/channels/stockReserve/messages/request'

  requestStockRelease:
    action: send
    title: fulfillment.stock.release
    summary: Caller — orders.saga. Responder — fulfillment.
    channel:
      $ref: '#/channels/stockRelease'
    description: |
      **The compensating command.** Moves the order's reservations from
      `reserved` to `released`, decrements `reservedUnits` and emits exactly one
      `stock.released.v1` (R34). If every reservation of that order is already
      `released`, the reply is a **success no-op** — `outcome:
      already_released`, no counter change, **no second fact** (invariant F5) —
      which is what makes a redelivered `credit.rejected.v1` harmless.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/stockReleaseReply'
      messages:
        - $ref: '#/channels/stockReleaseReply/messages/success'
        - $ref: '#/channels/stockReleaseReply/messages/error'
    messages:
      - $ref: '#/channels/stockRelease/messages/request'

  requestStockList:
    action: send
    title: fulfillment.stock.list
    summary: Caller — gateway. Responder — fulfillment.
    channel:
      $ref: '#/channels/stockList'
    description: |
      Read-only view of on-hand and reserved units. Backs `GET /stock` and the
      demo replenishment workflow's `belowThreshold` query.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/stockListReply'
      messages:
        - $ref: '#/channels/stockListReply/messages/success'
        - $ref: '#/channels/stockListReply/messages/error'
    messages:
      - $ref: '#/channels/stockList/messages/request'

  requestStockReplenish:
    action: send
    title: fulfillment.stock.replenish
    summary: Caller — gateway (demo replenishment workflow). Responder — fulfillment.
    channel:
      $ref: '#/channels/stockReplenish'
    description: |
      Adds on-hand units so a long-running demo never starves. It touches
      `units` only — `reservedUnits` and every reservation are untouched, and
      invariant F1 (`reservedUnits ≤ units`) therefore cannot be broken by a
      replenishment. It emits **no fact**: stock top-up is an operational act
      outside any order's saga, so it belongs in no order timeline.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/stockReplenishReply'
      messages:
        - $ref: '#/channels/stockReplenishReply/messages/success'
        - $ref: '#/channels/stockReplenishReply/messages/error'
    messages:
      - $ref: '#/channels/stockReplenish/messages/request'

  requestDespatchCreate:
    action: send
    title: fulfillment.despatch.create
    summary: Caller — orders.saga. Responder — fulfillment.
    channel:
      $ref: '#/channels/despatchCreate'
    description: |
      Moves the order's reservations from `reserved` to `consumed`, creates
      exactly one despatch advice whose lines despatch exactly the reserved
      units, and emits exactly one `order.despatched.v1` (R36). Idempotent by
      (`orderReference`, `despatch`): a repeat returns the existing
      `despatchReference` with `created: false` and emits no second fact
      (invariant F8).
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/despatchCreateReply'
      messages:
        - $ref: '#/channels/despatchCreateReply/messages/success'
        - $ref: '#/channels/despatchCreateReply/messages/error'
    messages:
      - $ref: '#/channels/despatchCreate/messages/request'

  requestCreditHold:
    action: send
    title: billing.credit.hold
    summary: Caller — orders.saga. Responder — billing.
    channel:
      $ref: '#/channels/creditHold'
    description: |
      Places a hold for the order total against the retailer's credit line.
      Approval appends a `hold` ledger entry and emits `credit.approved.v1`
      (R38). Rejection appends **no** ledger entry and emits
      `credit.rejected.v1` with a machine-readable `reason` (R39) — one of
      `over_limit`, `simulated_cents_rule` (the `.99` **simulator affordance**,
      R42) or `simulated_failure_rate` (R43). The three are indistinguishable
      downstream except by that field (R44). Idempotent by (`orderReference`,
      `hold`): a repeat returns the existing hold (invariant B4).
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/creditHoldReply'
      messages:
        - $ref: '#/channels/creditHoldReply/messages/success'
        - $ref: '#/channels/creditHoldReply/messages/error'
    messages:
      - $ref: '#/channels/creditHold/messages/request'

  requestCreditRelease:
    action: send
    title: billing.credit.release
    summary: Caller — orders.saga. Responder — billing.
    channel:
      $ref: '#/channels/creditRelease'
    description: |
      Releases the order's outstanding hold, appending exactly one `release`
      ledger entry and emitting `credit.released.v1` with `reason:
      order_cancelled` (added to Phase 14's operator-cancellation feature;
      the domain method `BuyerCredit.releaseHold` and the `order_cancelled`
      reason already existed — only this RPC surface was missing). Idempotent
      by construction: exposure is recomputed from the ledger on every call,
      so a repeat after the hold is already released finds zero outstanding
      exposure and appends nothing (BC11, B5) — the reply still reports
      success, `released` false, so a caller can tell a repeat from a first
      release without treating either as an error.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/creditReleaseReply'
      messages:
        - $ref: '#/channels/creditReleaseReply/messages/success'
        - $ref: '#/channels/creditReleaseReply/messages/error'
    messages:
      - $ref: '#/channels/creditRelease/messages/request'

  requestCreditList:
    action: send
    title: billing.credit.list
    summary: Caller — gateway. Responder — billing.
    channel:
      $ref: '#/channels/creditList'
    description: Read-only view of credit limits, active holds, open exposure and available credit.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/creditListReply'
      messages:
        - $ref: '#/channels/creditListReply/messages/success'
        - $ref: '#/channels/creditListReply/messages/error'
    messages:
      - $ref: '#/channels/creditList/messages/request'

  requestInvoiceIssue:
    action: send
    title: billing.invoice.issue
    summary: Caller — orders.saga. Responder — billing.
    channel:
      $ref: '#/channels/invoiceIssue'
    description: |
      Creates exactly one invoice in status `issued`, converts the order's
      credit `hold` into open exposure with a `consume` ledger entry — which is
      numerically neutral on available credit and therefore emits **no**
      `credit.released.v1` (R40) — and emits exactly one `invoice.issued.v1`
      (R45). Idempotent by (`orderReference`, `issue`): a repeat returns the
      existing `invoiceReference` with `created: false` (invariant B7).
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/invoiceIssueReply'
      messages:
        - $ref: '#/channels/invoiceIssueReply/messages/success'
        - $ref: '#/channels/invoiceIssueReply/messages/error'
    messages:
      - $ref: '#/channels/invoiceIssue/messages/request'

  requestInvoiceList:
    action: send
    title: billing.invoice.list
    summary: Caller — gateway. Responder — billing.
    channel:
      $ref: '#/channels/invoiceList'
    description: |
      Read-only invoice view with a link back to the order. `issuedBeforeMinutes`
      is what the demo bank robot filters on when it pays invoices "within
      terms".
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/invoiceListReply'
      messages:
        - $ref: '#/channels/invoiceListReply/messages/success'
        - $ref: '#/channels/invoiceListReply/messages/error'
    messages:
      - $ref: '#/channels/invoiceList/messages/request'

  requestPaymentRegister:
    action: send
    title: billing.payment.register
    summary: Caller — gateway (operator, API tests, external payment robot). Responder — billing.
    channel:
      $ref: '#/channels/paymentRegister'
    description: |
      **Remittance intake — the only way an invoice becomes `paid`.** There is
      no internal payment timer; payment always arrives from outside the system.

      On an unseen `paymentReference` whose amount and currency equal the
      invoice total, the responder records the payment, moves the invoice
      `issued → paid`, appends a `release` ledger entry, and emits
      `payment.received.v1` **followed by** `credit.released.v1` in that order
      and in the same transaction (R47).

      **Idempotent by `paymentReference` (R48):** a repeat returns the original
      outcome with `outcome: duplicate`, records no second payment and emits no
      second fact. A mismatched amount or currency, or a different
      `paymentReference` against an already-`paid` invoice, is rejected with a
      machine-readable reason and changes nothing (R49).
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/paymentRegisterReply'
      messages:
        - $ref: '#/channels/paymentRegisterReply/messages/success'
        - $ref: '#/channels/paymentRegisterReply/messages/error'
    messages:
      - $ref: '#/channels/paymentRegister/messages/request'

  requestCatalogReferenceList:
    action: send
    title: catalog.reference.list
    summary: Caller — gateway. Responder — orders.
    channel:
      $ref: '#/channels/catalogReferenceList'
    description: |
      Reference data — products, retailers, companies, currencies — for the
      place-order form. Read-only; the catalogue is owned by the Orders context.
    reply:
      address:
        location: '$message.header#/reply-to'
      channel:
        $ref: '#/channels/catalogReferenceListReply'
      messages:
        - $ref: '#/channels/catalogReferenceListReply/messages/success'
        - $ref: '#/channels/catalogReferenceListReply/messages/error'
    messages:
      - $ref: '#/channels/catalogReferenceList/messages/request'

components:
  correlationIds:
    orderCorrelationId:
      description: |
        The order id. It is the `correlationId` of every fact in one order's
        saga, the partition key of every fact topic, the read-model document
        key and the log correlation id (R12, R15).
      location: '$message.payload#/correlationId'
    rpcCorrelationId:
      description: |
        The order id when the request concerns a known order, otherwise the
        gateway request id. Carried in a header because RPC messages have no
        envelope.
      location: '$message.header#/x-correlation-id'

  messages:
    # ───────────────────────────── the 14 facts ─────────────────────────────
    OrderPlaced:
      name: order.placed.v1
      title: Order placed
      summary: An order was accepted and persisted; the saga starts.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/OrderPlacedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: orders
      examples:
        - name: placedEurOrder
          summary: A EUR order of two lines totalling 1 242,50 € (124250 minor units)
          payload:
            eventId: 5b7a0f1e-1f22-4c1f-9f2a-8c1a1f2b3c4d
            eventType: order.placed.v1
            aggregateId: 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
            correlationId: 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
            causationId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
            occurredAt: '2026-08-18T10:15:00.000Z'
            payload:
              orderReference: ORD-000042
              retailerCode: CarrefourEs
              companyCode: IBERFOODS
              buyerGln: '8412345000013'
              supplierGln: '8400000000017'
              currency: EUR
              orderDate: '2026-08-18T10:15:00.000Z'
              lines:
                - productCode: PRD-0001
                  description: Olive oil 1 L
                  quantity: 5
                  unitPrice: 2995
                  lineDiscount: 0
                - productCode: PRD-0007
                  description: Sea salt 500 g
                  quantity: 25
                  unitPrice: 3891
                  lineDiscount: 0
              initialAmount: 124250
              initialDiscount: 0
              totalAmount: 124250

    StockReserved:
      name: stock.reserved.v1
      title: Stock reserved
      summary: Every line of the order was reserved.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/StockReservedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: fulfillment

    StockRejected:
      name: stock.rejected.v1
      title: Stock rejected
      summary: At least one line could not be reserved; nothing was reserved.
      description: |
        Reservation is all-or-nothing (invariant F3). This fact therefore means
        **no** reservation exists for the order, which is why the orchestrator
        must **not** issue a release command when it observes it (R26).
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/StockRejectedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: fulfillment
        - name: compensation

    StockReleased:
      name: stock.released.v1
      title: Stock released
      summary: A previously held reservation was returned to available stock (compensation).
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/StockReleasedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: fulfillment
        - name: compensation

    CreditApproved:
      name: credit.approved.v1
      title: Credit approved
      summary: A hold for the order total was placed within the retailer's limit.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/CreditApprovedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: billing

    CreditRejected:
      name: credit.rejected.v1
      title: Credit rejected
      summary: The hold was refused; no ledger entry was written.
      description: |
        `reason` distinguishes a genuine over-limit refusal from the two
        **simulator affordances** (`simulated_cents_rule`, R42;
        `simulated_failure_rate`, R43). Everything else about the fact — type,
        payload shape, compensation path — is identical, by requirement (R44).
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/CreditRejectedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: billing
        - name: compensation
      examples:
        - name: centsRuleRejection
          summary: The .99 simulator affordance firing on a 1 242,99 € total
          payload:
            eventId: 7d8e9f0a-1b2c-4d3e-8f4a-5b6c7d8e9f01
            eventType: credit.rejected.v1
            aggregateId: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d
            correlationId: 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
            causationId: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
            occurredAt: '2026-08-18T10:15:04.120Z'
            payload:
              orderReference: ORD-000042
              retailerCode: CarrefourEs
              companyCode: IBERFOODS
              requestedAmount: 124299
              currency: EUR
              availableCredit: 500000
              reason: simulated_cents_rule

    CreditReleased:
      name: credit.released.v1
      title: Credit released
      summary: A hold or open exposure was returned to the retailer's available credit.
      description: |
        Emitted only when credit genuinely returns: `invoice_paid` (the
        remittance closed the exposure) or `order_cancelled` (an order holding
        credit was cancelled before invoicing). The `consume` ledger entry at
        invoice issue is numerically neutral and emits nothing (R40).
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/FactHeaders'
      payload:
        $ref: '#/components/schemas/CreditReleasedEvent'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
