    # ── the 14th fact (observability_reliability / feature 27) ───────────────
    # OrderSagaFailedPayload is the 14th fact, added to satisfy R29's
    # dead-letter clause ("record a saga-failure entry in the order
    # timeline" — `order timeline` is R50's defined term, the projector's
    # read model). Gate decision (progress/spec_observability_reliability.md's
    # open-points table, row 3): Option 1 — mint this fact — chosen over
    # Option 2 (an Orders-owned side channel merged only at the Gateway).
    # Registered on the `ordersFacts` channel's `messages:` map, consumed by
    # the projector alongside the other thirteen (never by `orders.saga`
    # itself, which emits it, and never by `notifications`, which is
    # purely diagnostic — see the channel's own description).
    OrderSagaFailedPayload:
      type: object
      description: A saga command was retried to exhaustion (SO4) and parked (SO5) without ever completing; the order stays in its last legal status. Emitted at most once per parked `saga_commands` row (OR3), on the first park transition only — a later re-park after a further exhausted retry emits nothing further.
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        command:
          type: string
          description: The saga command that could not be delivered — one of `stock.reserve`, `stock.release`, `despatch.create`, `credit.hold`, `invoice.issue`.
        attempts:
          type: integer
          minimum: 1
          description: In-line attempts made before parking (SO4's configured maximum).
        lastError:
          type: string
          description: The error of the final in-line attempt.
        failedAt:
          $ref: '#/components/schemas/Instant'
      required:
        - orderReference
        - command
        - attempts
        - lastError
        - failedAt

