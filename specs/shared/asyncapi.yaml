asyncapi: 3.0.0

info:
  title: Order-To-Cash — Messaging Contract
  version: 1.0.0
  description: |
    **Stack-agnostic** messaging contract of the Order-To-Cash trilogy, reused
    **verbatim** by assessments **#7**, **#8** and **#9**. It defines the two
    transports, the fact topics and their dead-letter companions, the shared
    event envelope, all fourteen domain facts, and every request-reply subject
    with both its request and its reply schema.

    Companion documents: `domain-model.md` (aggregates, invariants, the fact
    catalogue), `saga.md` (sequence, compensation, idempotency) and
    `requirements.md` (`R1`–`R61`).

    ## The two transports

    | | Fact stream (Kafka) | RPC transport (NATS core request-reply) |
    |---|---|---|
    | Carries | The fourteen domain **facts** — immutable, durable, replayable | **Commands and queries** — one responder, answer needed now |
    | Channels here | `otc.*.facts.v1` (+ `.dlq`) | the `orders.*`, `fulfillment.*`, `billing.*`, `catalog.*` subjects |
    | Delivery | At-least-once, per-order ordered by partition key | At-most-once; a timeout is a legitimate, handled answer |
    | Advances the saga | **Yes — only facts advance it** | **No.** A reply is used only to decide whether to retry |

    ## Normative rules encoded by this document

    1. **Envelope (R11).** Every fact carries `eventId`, `eventType`,
       `aggregateId`, `correlationId`, `causationId`, `occurredAt` and
       `payload`. No field may be absent, null or empty.
    2. **Correlation (R12, R15).** `correlationId` is **always the order id**.
       It is the partition key of every fact topic, so all facts produced by one
       context about one order are delivered in emission order.
    3. **Money (R1).** Every monetary value is an **integer count of minor
       units** plus an ISO 4217 alpha-3 currency code. There is no decimal,
       floating-point or major-unit representation anywhere in this contract.
       Two shapes express it, and they are used consistently across this
       document and `openapi.yaml`:
       - `Money` — an object `{ amount, currency }`, used wherever an amount
         travels **alone**;
       - `MinorUnits` — a bare integer, used wherever the **enclosing object
         already declares** its `currency` (order lines, invoice lines, totals
         inside a payload that carries `currency`).
    4. **Versioning.** The `v<n>` suffix is part of the `eventType`. A breaking
       payload change is a **new** `v<n+1>` message carried alongside the old
       one on the same topic, never a redefinition of this one. Additive,
       optional fields are non-breaking, which is why payload schemas do not
       close `additionalProperties`.
    5. **Idempotency (R17, R18).** `eventId` is the idempotency key of every
       consumer; the dedup key is the pair (`eventId`, consumer name). RPC
       commands are idempotent by (`orderReference`, operation), except
       `billing.payment.register`, which is idempotent by `paymentReference`
       (R48).
    6. **Tracing (R57).** Every message on both transports carries W3C trace
       context headers, and consumers continue the trace rather than starting a
       new one.
  license:
    name: Assessment material — not for redistribution
  tags:
    - name: order-to-cash
    - name: saga
    - name: stack-agnostic

defaultContentType: application/json

servers:
  factStream:
    host: fact-stream:9092
    protocol: kafka
    title: Fact stream
    summary: Durable, replayable, many-consumer log carrying domain facts.
    description: |
      Broker-neutral logical server for the Kafka-protocol fact stream. Host,
      authentication and client tuning are per-assessment concerns and belong in
      each assessment's `design.md`.
    tags:
      - name: facts
  rpcTransport:
    host: rpc-transport:4222
    protocol: nats
    title: RPC transport
    summary: Request-reply bus carrying commands and synchronous queries.
    description: |
      NATS **core** request-reply. No durability, no replay, no stream: nothing
      on this transport needs them, and a timeout is a legitimate answer that
      the caller handles (R29).
    tags:
      - name: rpc

channels:
  # ────────────────────────────── fact topics ──────────────────────────────
  ordersFacts:
    address: otc.orders.facts.v1
    title: Orders facts
    summary: Facts produced by the Orders context about the Order aggregate.
    description: |
      **Producer:** `orders`.
      **Consumers:** `orders.saga` (for `order.placed.v1` only — the
      orchestrator ignores the three facts it produced itself, and never
      consumes `order.saga_failed.v1` either — it is the one that emits
      it), `projector` (all facts), `notifications` (four of the five
      facts on this topic — not `order.saga_failed.v1`, which is purely
      diagnostic, R29's dead-letter clause / OR3).

      Partition key: `correlationId` (the order id).
    servers:
      - $ref: '#/servers/factStream'
    messages:
      orderPlaced:
        $ref: '#/components/messages/OrderPlaced'
      orderConfirmed:
        $ref: '#/components/messages/OrderConfirmed'
      orderCompleted:
        $ref: '#/components/messages/OrderCompleted'
      orderCancelled:
        $ref: '#/components/messages/OrderCancelled'
      orderSagaFailed:
        $ref: '#/components/messages/OrderSagaFailed'
    bindings:
      kafka:
        topic: otc.orders.facts.v1
        bindingVersion: '0.5.0'

  fulfillmentFacts:
    address: otc.fulfillment.facts.v1
    title: Fulfillment facts
    summary: Facts produced by the Fulfillment context about stock and despatch.
    description: |
      **Producer:** `fulfillment`.
      **Consumers:** `orders.saga` (all four), `projector` (all four),
      `notifications` (`order.despatched.v1` only — `stock.*` facts are internal
      saga mechanics).

      Partition key: `correlationId` (the order id).
    servers:
      - $ref: '#/servers/factStream'
    messages:
      stockReserved:
        $ref: '#/components/messages/StockReserved'
      stockRejected:
        $ref: '#/components/messages/StockRejected'
      stockReleased:
        $ref: '#/components/messages/StockReleased'
      orderDespatched:
        $ref: '#/components/messages/OrderDespatched'
    bindings:
      kafka:
        topic: otc.fulfillment.facts.v1
        bindingVersion: '0.5.0'

  billingFacts:
    address: otc.billing.facts.v1
    title: Billing facts
    summary: Facts produced by the Billing context about credit, invoices and payments.
    description: |
      **Producer:** `billing`.
      **Consumers:** `orders.saga` (all five), `projector` (all five),
      `notifications` (`invoice.issued.v1` and `payment.received.v1` only —
      `credit.*` facts are internal saga mechanics).

      `payment.received.v1` and `credit.released.v1` are written to the outbox
      **in one transaction, in that order, on the same partition key**, which is
      what lets the orchestrator rely on the sequence `invoiced → paid →
      completed` without assuming any cross-context ordering (`saga.md` §6).
    servers:
      - $ref: '#/servers/factStream'
    messages:
      creditApproved:
        $ref: '#/components/messages/CreditApproved'
      creditRejected:
        $ref: '#/components/messages/CreditRejected'
      creditReleased:
        $ref: '#/components/messages/CreditReleased'
      invoiceIssued:
        $ref: '#/components/messages/InvoiceIssued'
      paymentReceived:
        $ref: '#/components/messages/PaymentReceived'
    bindings:
      kafka:
        topic: otc.billing.facts.v1
        bindingVersion: '0.5.0'

  # ───────────────────────────── dead-letter topics ─────────────────────────
  ordersFactsDlq:
    address: otc.orders.facts.v1.dlq
    title: Orders facts — dead letter
    summary: Facts from otc.orders.facts.v1 that a consumer failed to process N times.
    description: &dlqDescription |
      **Producer:** the retry handler of the failing consumer, after the
      configured maximum number of attempts is exhausted (R16). The original
      fact is then **acknowledged** on its source topic so the partition is not
      blocked.

      **Consumers:** humans, through the broker console. No service consumes a
      dead-letter topic automatically; redriving is a deliberate operational
      act.

      The payload is the **unmodified original envelope**. Everything diagnostic
      travels in headers, so a redrive is a byte-for-byte republish onto the
      source topic. `x-failed-consumer`, `x-attempts` and `x-error` are
      mandatory; dead-letter depth per topic is a required metric (R59).
    servers:
      - $ref: '#/servers/factStream'
    messages:
      deadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
    bindings:
      kafka:
        topic: otc.orders.facts.v1.dlq
        bindingVersion: '0.5.0'

  fulfillmentFactsDlq:
    address: otc.fulfillment.facts.v1.dlq
    title: Fulfillment facts — dead letter
    summary: Facts from otc.fulfillment.facts.v1 that a consumer failed to process N times.
    description: *dlqDescription
    servers:
      - $ref: '#/servers/factStream'
    messages:
      deadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
    bindings:
      kafka:
        topic: otc.fulfillment.facts.v1.dlq
        bindingVersion: '0.5.0'

  billingFactsDlq:
    address: otc.billing.facts.v1.dlq
    title: Billing facts — dead letter
    summary: Facts from otc.billing.facts.v1 that a consumer failed to process N times.
    description: *dlqDescription
    servers:
      - $ref: '#/servers/factStream'
    messages:
      deadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
    bindings:
      kafka:
        topic: otc.billing.facts.v1.dlq
        bindingVersion: '0.5.0'

  # ─────────────────────────── RPC — request channels ───────────────────────
  ordersCreate:
    address: orders.create
    title: orders.create — request
    summary: Place an order. Caller — gateway. Responder — orders.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/OrdersCreateRequest'
  ordersCreateReply:
    address: null
    title: orders.create — reply
    description: &replyChannelDescription |
      Reply channel. The address is the caller-supplied reply subject (a NATS
      inbox), unknown at design time. **A reply never advances the saga**
      (`saga.md` §2): it tells the caller only whether to retry.

      Absence of any reply within the caller's deadline is a **timeout** — see
      `components.schemas.RpcTimeout` for the semantics and
      `components.messages.RpcErrorReply` for the error shape.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/OrdersCreateReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  ordersCancel:
    address: orders.cancel
    title: orders.cancel — request
    summary: Operator cancellation, pre-despatched only. Caller — gateway. Responder — orders.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/OrdersCancelRequest'
  ordersCancelReply:
    address: null
    title: orders.cancel — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/OrdersCancelReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  stockCheck:
    address: fulfillment.stock.check
    title: fulfillment.stock.check — request
    summary: Non-locking availability read at order acceptance. Caller — orders. Responder — fulfillment.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/StockCheckRequest'
  stockCheckReply:
    address: null
    title: fulfillment.stock.check — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/StockCheckReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  stockReserve:
    address: fulfillment.stock.reserve
    title: fulfillment.stock.reserve — request
    summary: Reserve every line of an order, all-or-nothing. Caller — orders.saga. Responder — fulfillment.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/StockReserveRequest'
  stockReserveReply:
    address: null
    title: fulfillment.stock.reserve — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/StockReserveReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  stockRelease:
    address: fulfillment.stock.release
    title: fulfillment.stock.release — request
    summary: Compensation — release an order's reservations. Caller — orders.saga. Responder — fulfillment.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/StockReleaseRequest'
  stockReleaseReply:
    address: null
    title: fulfillment.stock.release — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/StockReleaseReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  stockList:
    address: fulfillment.stock.list
    title: fulfillment.stock.list — request
    summary: On-hand and reserved units. Caller — gateway. Responder — fulfillment.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/StockListRequest'
  stockListReply:
    address: null
    title: fulfillment.stock.list — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/StockListReply'
      error:
        $ref: '#/components/messages/RpcErrorReply'

  stockReplenish:
    address: fulfillment.stock.replenish
    title: fulfillment.stock.replenish — request
    summary: Top up on-hand units. Caller — gateway (demo replenishment workflow). Responder — fulfillment.
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      request:
        $ref: '#/components/messages/StockReplenishRequest'
  stockReplenishReply:
    address: null
    title: fulfillment.stock.replenish — reply
    description: *replyChannelDescription
    servers:
      - $ref: '#/servers/rpcTransport'
    messages:
      success:
        $ref: '#/components/messages/StockReplenishReply'
