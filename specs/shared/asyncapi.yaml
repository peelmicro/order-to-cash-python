        decimalPoints:
          type: integer
          minimum: 0
          description: How many decimal places the currency has when **rendered**. It never changes the fact that amounts are transported as integer minor units.
      required:
        - code
        - decimalPoints

    # ───────────────────── RPC request / reply payloads ─────────────────────
    OrdersCreateRequestPayload:
      type: object
      properties:
        requestId:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: Optional client-supplied idempotency key. A repeat with the same value returns the original order instead of placing a second one.
        retailerCode:
          $ref: '#/components/schemas/PartyCode'
        companyCode:
          $ref: '#/components/schemas/PartyCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productCode:
                $ref: '#/components/schemas/ProductCode'
              quantity:
                $ref: '#/components/schemas/Quantity'
              unitPrice:
                $ref: '#/components/schemas/MinorUnits'
                description: Optional. When omitted the responder snapshots the catalogue price. When supplied it must match the enclosing `currency`.
              lineDiscount:
                $ref: '#/components/schemas/MinorUnits'
            required:
              - productCode
              - quantity
        orderDiscount:
          $ref: '#/components/schemas/MinorUnits'
        notes:
          type: string
      required:
        - retailerCode
        - companyCode
        - currency
        - lines

    OrdersCreateReplyPayload:
      type: object
      properties:
        orderId:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: Also the saga `correlationId` of every fact this order will produce.
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        status:
          const: placed
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        initialAmount:
          $ref: '#/components/schemas/MinorUnits'
        initialDiscount:
          $ref: '#/components/schemas/MinorUnits'
        totalAmount:
          $ref: '#/components/schemas/MinorUnits'
        orderDate:
          $ref: '#/components/schemas/Instant'
      required:
        - orderId
        - orderReference
        - status
        - currency
        - totalAmount
        - orderDate

    OrdersCancelRequestPayload:
      type: object
      properties:
        orderId:
          $ref: '#/components/schemas/UniqueId'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        reason:
          const: operator_cancelled
          description: Operator cancellation is the only reason a caller may request. `stock_rejected` and `credit_rejected` are decided by the saga, never asked for.
        note:
          type: string
      required:
        - reason

    OrdersCancelReplyPayload:
      type: object
      properties:
        orderId:
          $ref: '#/components/schemas/UniqueId'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        status:
          $ref: '#/components/schemas/OrderStatus'
        cancellationReason:
          $ref: '#/components/schemas/CancellationReason'
        compensationPlanned:
          type: array
          description: The acquisitions that will be unwound, in the order they are released (`saga.md` §4.3) — `stock_release` then `credit_release` from `credit_approved` or `confirmed`. The cancellation itself completes only when their facts arrive, and from those two statuses it can be overtaken by the despatch already requested.
          items:
            type: string
            enum:
              - credit_release
              - stock_release
      required:
        - orderId
        - orderReference
        - status
        - compensationPlanned

    StockCheckRequestPayload:
      type: object
      properties:
        companyCode:
          $ref: '#/components/schemas/PartyCode'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productCode:
                $ref: '#/components/schemas/ProductCode'
              quantity:
                $ref: '#/components/schemas/Quantity'
            required:
              - productCode
              - quantity
      required:
        - companyCode
        - lines

    StockCheckReplyPayload:
      type: object
      properties:
        available:
          type: boolean
          description: True only when every line is satisfiable **at the moment of the read**. It is not a promise, and it is not a reservation.
        lines:
          type: array
          items:
            type: object
            properties:
              productCode:
                $ref: '#/components/schemas/ProductCode'
              requested:
                $ref: '#/components/schemas/Quantity'
              available:
                $ref: '#/components/schemas/UnitCount'
              sufficient:
                type: boolean
            required:
              - productCode
              - requested
              - available
              - sufficient
      required:
        - available
        - lines

    StockReserveRequestPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        retailerCode:
          $ref: '#/components/schemas/PartyCode'
        companyCode:
          $ref: '#/components/schemas/PartyCode'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productCode:
                $ref: '#/components/schemas/ProductCode'
              units:
                $ref: '#/components/schemas/Quantity'
            required:
              - productCode
              - units
      required:
        - orderReference
        - retailerCode
        - companyCode
        - lines

    StockReserveReplyPayload:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - accepted
            - rejected
            - already_reserved
          description: '`already_reserved` is the idempotent repeat — the existing reservations are returned and no second `stock.reserved.v1` is emitted.'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        reservations:
          type: array
          description: Present when `outcome` is `accepted` or `already_reserved`.
          items:
            $ref: '#/components/schemas/ReservationRef'
        shortages:
          type: array
          description: Present when `outcome` is `rejected`. Nothing was reserved (invariant F3).
          items:
            $ref: '#/components/schemas/Shortage'
      required:
        - outcome
        - orderReference

    StockReleaseRequestPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        reason:
          type: string
          enum:
            - credit_rejected
            - order_cancelled
      required:
        - orderReference
        - reason

    StockReleaseReplyPayload:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - released
            - already_released
          description: '`already_released` is a **success no-op**: no counter changed and no second fact was emitted (invariant F5, R34).'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        released:
          type: array
          items:
            $ref: '#/components/schemas/ReservationRef'
      required:
        - outcome
        - orderReference

    StockListRequestPayload:
      allOf:
        - $ref: '#/components/schemas/PageRequest'
        - type: object
          properties:
            companyCode:
              $ref: '#/components/schemas/PartyCode'
            productCode:
              $ref: '#/components/schemas/ProductCode'
            belowThreshold:
              type: boolean
              description: When true, return only items whose available units are below `lowStockThreshold`. This is the query the demo replenishment workflow runs.

    StockListReplyPayload:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockView'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page

    StockReplenishRequestPayload:
      type: object
      properties:
        companyCode:
          $ref: '#/components/schemas/PartyCode'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productCode:
                $ref: '#/components/schemas/ProductCode'
              units:
                $ref: '#/components/schemas/Quantity'
                description: Units to **add** to on-hand stock. This is a delta, not a target level.
            required:
              - productCode
              - units
      required:
        - companyCode
        - lines

    StockReplenishReplyPayload:
      type: object
      properties:
        items:
          type: array
          description: The affected stock items after replenishment.
          items:
            $ref: '#/components/schemas/StockView'
      required:
        - items

    DespatchCreateRequestPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
      required:
        - orderReference

    DespatchCreateReplyPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        despatchReference:
          $ref: '#/components/schemas/DespatchReference'
        despatchDate:
          $ref: '#/components/schemas/Instant'
        created:
          type: boolean
          description: False on the idempotent repeat — the existing despatch advice is returned and no second fact is emitted (invariant F8).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DespatchLine'
      required:
        - orderReference
        - despatchReference
        - despatchDate
        - created

    CreditHoldRequestPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        retailerCode:
          $ref: '#/components/schemas/PartyCode'
        companyCode:
          $ref: '#/components/schemas/PartyCode'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The order's total amount. It travels alone here, so it is a `Money` object — integer minor units plus currency.
      required:
        - orderReference
        - retailerCode
        - companyCode
        - amount

    CreditHoldReplyPayload:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - approved
            - rejected
            - already_held
          description: '`already_held` is the idempotent repeat (invariant B4) — the existing hold is returned and no second fact is emitted.'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        creditCode:
          $ref: '#/components/schemas/CreditCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        heldAmount:
          $ref: '#/components/schemas/MinorUnits'
        availableCredit:
          $ref: '#/components/schemas/MinorUnits'
        reason:
          type: string
          enum:
            - over_limit
            - simulated_cents_rule
            - simulated_failure_rate
          description: Present when `outcome` is `rejected`, and identical to the `reason` of the emitted `credit.rejected.v1` (R44).
      required:
        - outcome
        - orderReference
        - currency
        - availableCredit

    CreditReleaseRequestPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        retailerCode:
          $ref: '#/components/schemas/PartyCode'
        companyCode:
          $ref: '#/components/schemas/PartyCode'
      required:
        - orderReference
        - retailerCode
        - companyCode
      description: |
        `reason` is not a caller-supplied field — this RPC always releases
        with reason `order_cancelled` (the only external trigger for it).
        `invoice_paid` is set only by Billing's own payment-registration flow,
        never by an external caller.

    CreditReleaseReplyPayload:
      type: object
      properties:
        released:
          type: boolean
          description: |
            `true` — an outstanding hold existed and was released this call.
            `false` — idempotent repeat or nothing was ever held (BC11, B5);
            not an error, no ledger entry, no fact.
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        creditCode:
          $ref: '#/components/schemas/CreditCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        releasedAmount:
          $ref: '#/components/schemas/MinorUnits'
        availableCreditAfter:
          $ref: '#/components/schemas/MinorUnits'
      required:
        - released
        - orderReference
        - currency
        - availableCreditAfter

    CreditListRequestPayload:
      allOf:
        - $ref: '#/components/schemas/PageRequest'
        - type: object
          properties:
            retailerCode:
              $ref: '#/components/schemas/PartyCode'
            companyCode:
              $ref: '#/components/schemas/PartyCode'

    CreditListReplyPayload:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditView'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page

    InvoiceIssueRequestPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        retailerCode:
          $ref: '#/components/schemas/PartyCode'
        companyCode:
          $ref: '#/components/schemas/PartyCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        lines:
          type: array
          minItems: 1
          description: The despatched lines. The invoice mirrors them exactly — partial despatch and partial invoicing are out of scope (invariant F7).
          items:
            $ref: '#/components/schemas/InvoiceLine'
        discount:
          $ref: '#/components/schemas/MinorUnits'
      required:
        - orderReference
        - retailerCode
        - companyCode
        - currency
        - lines

    InvoiceIssueReplyPayload:
      type: object
      properties:
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        invoiceId:
          $ref: '#/components/schemas/UniqueId'
        invoiceReference:
          $ref: '#/components/schemas/InvoiceReference'
        invoiceDate:
          $ref: '#/components/schemas/Instant'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        totalAmount:
          $ref: '#/components/schemas/MinorUnits'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        created:
          type: boolean
          description: False on the idempotent repeat — the existing invoice is returned and no second fact is emitted (invariant B7).
      required:
        - orderReference
        - invoiceReference
        - invoiceDate
        - currency
        - totalAmount
        - status
        - created

    InvoiceListRequestPayload:
      allOf:
        - $ref: '#/components/schemas/PageRequest'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/InvoiceStatus'
            retailerCode:
              $ref: '#/components/schemas/PartyCode'
            companyCode:
              $ref: '#/components/schemas/PartyCode'
            orderReference:
              $ref: '#/components/schemas/OrderReference'
            issuedBeforeMinutes:
              type: integer
              minimum: 0
              description: Return only invoices issued at least this many minutes ago. This is how the demo payment robot selects invoices to pay "within terms".

    InvoiceListReplyPayload:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceView'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page

    PaymentRegisterRequestPayload:
      type: object
      properties:
        invoiceId:
          $ref: '#/components/schemas/UniqueId'
        invoiceReference:
          $ref: '#/components/schemas/InvoiceReference'
        paymentReference:
          allOf:
            - $ref: '#/components/schemas/PaymentReference'
          description: '**The idempotency key.** A repeat returns the original outcome and emits no second fact (R48).'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Must equal the invoice `totalAmount` and currency exactly. Partial payment is out of scope (invariant B10).
        valueDate:
          $ref: '#/components/schemas/Instant'
        source:
          $ref: '#/components/schemas/PaymentSource'
      required:
        - paymentReference
        - amount
        - valueDate
        - source

    PaymentRegisterReplyPayload:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - accepted
            - duplicate
          description: '`duplicate` is the idempotent replay of an already-recorded `paymentReference`, carrying the **original** outcome (R48). A mismatched amount or currency is not a duplicate — it is an error reply (R49).'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        invoiceReference:
          $ref: '#/components/schemas/InvoiceReference'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
        invoiceStatus:
          $ref: '#/components/schemas/InvoiceStatus'
        paidAt:
          $ref: '#/components/schemas/Instant'
      required:
        - outcome
        - paymentReference
        - invoiceReference
        - invoiceStatus

    CatalogReferenceListRequestPayload:
      type: object
      properties:
        kinds:
          type: array
          minItems: 1
          description: Which reference collections to return. Omit for all of them.
          items:
            type: string
            enum:
              - products
              - retailers
              - companies
              - currencies
        includeDisabled:
          type: boolean
          default: false

    CatalogReferenceListReplyPayload:
      type: object
      description: Only the requested collections are present.
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        retailers:
          type: array
          items:
            $ref: '#/components/schemas/Party'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Party'
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyView'
