    # ───────────────────────── RPC common structures ────────────────────────
    RpcHeaders:
      type: object
      description: Headers carried by every request and every reply on the RPC transport.
      properties:
        traceparent:
          type: string
          description: W3C trace context, injected on request and extracted by the responder so the trace continues across both brokers (R57).
        tracestate:
          type: string
        x-correlation-id:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: The order id when the request concerns a known order; otherwise the gateway request id. Present on every structured log line produced while handling the request (R58).
        x-request-id:
          allOf:
            - $ref: '#/components/schemas/UniqueId'
          description: Identity of this request attempt. A retry after a timeout reuses the same value, which is what lets a responder recognise a duplicate.
        x-deadline-ms:
          type: integer
          minimum: 1
          description: The caller's remaining budget in milliseconds. A responder that cannot answer within it should not start.
      required:
        - traceparent

    RpcError:
      type: object
      title: RPC error reply
      description: |
        The error reply of every subject. `code` is stable and machine-readable;
        `message` is for humans and is never parsed.
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - NOT_FOUND
            - CONFLICT
            - PRECONDITION_FAILED
            - ORDER_NOT_CANCELLABLE
            - STOCK_UNAVAILABLE
            - INVOICE_NOT_PAYABLE
            - PAYMENT_MISMATCH
            - DOMAIN_ERROR
            - INTERNAL_ERROR
            - UNAVAILABLE
            - TIMEOUT
          description: |
            `TIMEOUT` is produced **by the caller**, not by a responder, when no
            reply arrives within the deadline — it exists here so callers can
            log and count timeouts in the same shape as real error replies.
        message:
          type: string
        details:
          type: object
          description: Structured context — offending field, shortages, expected versus observed status. Shape depends on `code`.
        correlationId:
          $ref: '#/components/schemas/UniqueId'
        occurredAt:
          $ref: '#/components/schemas/Instant'
      required:
        - code
        - message

    RpcTimeout:
      type: object
      title: RPC timeout — the absence of a reply
      description: |
        **A timeout is not a message.** It is the caller observing that no reply
        arrived within `x-deadline-ms`, and it is a legitimate, handled answer
        on this transport — which is precisely why the RPC transport needs no
        durability (`saga.md` §1).

        Handling is normative (R29): the orchestrator retries with backoff up to
        the configured maximum **while leaving the order status unchanged**, so
        the saga is always resumable from a legal state. Because every command
        is idempotent by (`orderReference`, operation), a retry that duplicates
        an effect the responder already applied returns the existing outcome
        instead of repeating it. On exhausting the attempts, the **triggering
        fact** is routed to the dead-letter topic and a saga-failure entry is
        written to the order timeline.

        This schema is documentation of that contract; nothing serialises it.
      properties:
        code:
          const: TIMEOUT
        subject:
          type: string
          description: The subject that did not answer.
        attempt:
          type: integer
          minimum: 1
        maxAttempts:
          type: integer
          minimum: 1
        deadlineMs:
          type: integer
          minimum: 1
        orderReference:
          $ref: '#/components/schemas/OrderReference'
      required:
        - code
        - subject
        - attempt

    PageRequest:
      type: object
      description: Common paging request fields for the read-only list subjects.
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          default: 25

    PageInfo:
      type: object
