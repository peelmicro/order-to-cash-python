    DeadLetterRecord:
      name: dead.letter.record
      title: Dead-letter record
      summary: An unmodified fact envelope that a named consumer failed to process N times.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelationId'
      headers:
        $ref: '#/components/schemas/DeadLetterHeaders'
      payload:
        $ref: '#/components/schemas/Envelope'
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/UniqueId'
          bindingVersion: '0.5.0'
      tags:
        - name: reliability
      examples:
        - name: projectorPoisonedFact
          summary: The projector gave up on a fact after 5 attempts
          headers:
            x-failed-consumer: projector
            x-attempts: 5
            x-error: 'ReadModelUnavailable: connection refused'
            x-original-topic: otc.billing.facts.v1
            x-first-failed-at: '2026-08-18T10:16:00.000Z'
            x-failed-at: '2026-08-18T10:16:31.442Z'
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01

    # ───────────────────────────── RPC messages ─────────────────────────────
    RpcErrorReply:
      name: rpc.error
      title: RPC error reply
      summary: The single error reply shape used by every request-reply subject.
      description: |
        Returned when the responder could not produce a success reply. It is
        **not** used for domain outcomes: an insufficient-stock or refused-credit
        answer is a *business outcome* carried in the success reply's `outcome`
