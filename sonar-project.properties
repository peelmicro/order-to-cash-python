# SonarQube scanner configuration — phase 21 (sonarqube_quality_gates, id 34).
# Ported from #7's order-to-cash-nestjs/sonar-project.properties, adapted for a Python + TypeScript repository.
#
# SonarQube is opt-in (`docker compose -f docker-compose.infra.yml --profile sonar up -d sonarqube`, see
# README.md "SonarQube"): ~1.5 GB of RAM, never started by the plain infra stack and never a dependency of
# ./quality.sh. The ENFORCED coverage gates are in quality.sh (section 6 overall >= 60, section 6b domain
# >= 80, both computed from ONE .coverage data file); this file only says what a scan analyses.
#
# The file is named sonar-project.properties (as in #7), NOT sonar-scan.properties (as in #8). #8 renamed it
# because `dotnet-sonarscanner end` refuses to finish while a file with that name exists anywhere in the
# repository. This repository is scanned by the plain `sonar-scanner` CLI (sonarsource/sonar-scanner-cli,
# the same scanner #7 uses), which reads exactly this name from the working directory; there is no .NET
# scanner here and no rename is needed. The scan is launched by scripts/sonar-scan.sh.

sonar.projectKey=order-to-cash-python
sonar.projectName=Order To Cash (Python)
sonar.sourceEncoding=UTF-8

# Single-project scan. sonar.sources does not accept globs, so every distribution's src/ is listed:
# the three packages, the seven services and the Angular app. Tests are listed separately (Python tests
# live in tests/, packages/*/tests and services/*/tests, all outside src/). apps/web/src is BOTH a source
# and a test directory (the *.spec.ts files sit beside the code), so sonar.test.inclusions decides which
# files are tests, as #7's file does for its own apps/ and packages/.
sonar.sources=\
  packages/shared_kernel/src,\
  packages/contracts/src,\
  packages/cqrs/src,\
  services/gateway/src,\
  services/orders/src,\
  services/fulfillment/src,\
  services/billing/src,\
  services/notifications/src,\
  services/projector/src,\
  services/seed/src,\
  apps/web/src
sonar.tests=\
  tests,\
  packages/shared_kernel/tests,\
  packages/contracts/tests,\
  packages/cqrs/tests,\
  services/gateway/tests,\
  services/orders/tests,\
  services/fulfillment/tests,\
  services/billing/tests,\
  services/notifications/tests,\
  services/projector/tests,\
  services/seed/tests,\
  apps/web/src,\
  apps/web/e2e
sonar.test.inclusions=\
  tests/**,\
  **/tests/**,\
  apps/web/src/**/*.spec.ts,\
  apps/web/e2e/**/*.ts

# Generated code never gets a quality opinion (same reasoning as #7's packages/contracts/src/generated/**
# and #8's apps/web/src/generated/**): the datamodel-code-generator output (checked for drift by
# quality.sh section 5) and the openapi-typescript output (checked by the web `types:check`).
# Build output and dependencies are excluded as well.
sonar.exclusions=\
  packages/contracts/src/otc_contracts/generated/**,\
  apps/web/src/generated/**,\
  **/node_modules/**,\
  **/dist/**,\
  .arm/**,\
  **/.angular/**,\
  **/.nitro/**,\
  **/.output/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/*.d.ts

# TypeScript: the three tsconfig files of apps/web, listed so the scanner does not walk the tree for
# tsconfig.json files (the first scan found one in the git-ignored .arm/ scratch directory and logged
# "ERROR Failed to parse tsconfig .arm/e2e32/e2e.bak/tsconfig.json"; a scan must not depend on whatever
# scratch copies a working tree happens to hold).
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,apps/web/tsconfig.spec.json,apps/web/e2e/tsconfig.json

# Python coverage: ONE Cobertura file for the whole workspace, written by `coverage xml` from the single
# .coverage data file the single pytest invocation of quality.sh section 6 produces (union by line, then by
# branch; no per-package averaging). scripts/sonar-scan.sh generates it. The scanner container mounts the
# repository at the SAME absolute path as the host: coverage.py writes absolute <source> directories plus
# filenames relative to them (otc_orders/main.py), and the scanner resolves a file against its <sources>.
# A stale or missing coverage.xml does not fail the scan, it silently reports 0%, so the script refuses to
# run without a .coverage file.
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# TypeScript coverage (apps/web) is not imported, as in #8 (../order-to-cash-dotnet/sonar-scan.properties:48-65,
# the documented gap; its sonar.coverage.exclusions at :105-109 does not exclude apps/web either, so the
# gap shows as 0.0%, the same here). apps/web has no vitest `coverage` setting and no dependency is added
# for it; a feature that owns apps/web can add an lcov reporter and sonar.javascript.lcov.reportPaths.

# Issue suppressions (phase 21): one entry per (rule, file) pair, never a directory glob and never a rule switched off globally.
# The first scan raised 25 BUG/VULNERABILITY issues; 1 true positive was fixed in code, the other 24 (14 pairs) are false positives,
# triaged in progress/impl_sonarqube_quality_gates.md (Round 2). Code smells are NOT suppressed.

# python:S3862 "Replace this expression with an iterable object" (1 issue, fact_handler.py:150, `self._metrics.closed(*closed)`).
# False positive: `closed` is declared `tuple[SagaOutcome, float] | None` (line 91), assigned through `nonlocal` inside the
# `work` closure (lines 94, 127, 142), and line 149 `if closed is not None` narrows it to the tuple that
# `SagaMetrics.closed(outcome, milliseconds)` takes. The analyzer loses the type across the `nonlocal` closure; `mypy --strict` accepts it.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3862
sonar.issue.ignore.multicriteria.e1.resourceKey=services/orders/src/otc_orders/application/saga/fact_handler.py

# python:S930 "Remove this unexpected named argument 'separate_input_output_schemas'" (1 issue, openapi_shape.py:44).
# False positive: the installed FastAPI (0.142.2) accepts it: `'separate_input_output_schemas' in
# inspect.signature(fastapi.openapi.utils.get_openapi).parameters` is True; the analyzer's bundled stub is older. The argument is
# load-bearing (comment at openapi_shape.py:40-42: the wire models' wrap serializer hides the fields from serialization mode).
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S930
sonar.issue.ignore.multicriteria.e2.resourceKey=services/gateway/src/otc_gateway/presentation/openapi_shape.py

# python:S5863 "same actual and expected expression" (10 issues in six test files, one entry per file).
# False positives: each assertion builds two separate instances (or calls a function twice) because the test IS the equality or hash
# contract: test_entity.py:23/24/92 (`Thing(identity) == Thing(identity)`, its `hash`, `Counter(identity) == Counter(identity)`),
# :29 (`Thing(UniqueId.new()) != Thing(UniqueId.new())`, two random ids), test_gln.py:144 (R4 value-object equality, `!=` on a
# different GLN on the next line), test_money.py:255 (beside the `!=` GBP and `not (==)` cases), test_quantity.py:96/98 (named
# "compares by value"), test_credit_decision_port.py:60 (`Approve() == Approve()`, frozen dataclass), test_deterministic_parity.py:59
# (the determinism claim is two calls of one function; line 60 proves distinct inputs differ).
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e3.resourceKey=packages/shared_kernel/tests/test_entity.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e4.resourceKey=packages/shared_kernel/tests/test_gln.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e5.resourceKey=packages/shared_kernel/tests/test_money.py
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e6.resourceKey=packages/shared_kernel/tests/test_quantity.py
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e7.resourceKey=services/billing/tests/unit/test_credit_decision_port.py
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e8.resourceKey=services/seed/tests/unit/test_deterministic_parity.py

# typescript:S2871 "Provide a compare function" (10 of the 24 suppressed issues; an eleventh, page-sweep.ts:150, was a true
# positive and is FIXED in code with `.sort((a, b) => a - b)`, not suppressed).
# False positives: every site sorts strings for a deterministic order, locale ordering is not a requirement:
#  - place.page.ts:253 sorts ISO 4217 currency codes (three uppercase ASCII letters), where UTF-16 code-unit order equals alphabetical order;
#  - number-boxes.ts:15 sorts test ids so two lists compare equal (error-text.sweep.spec.ts:858 uses the list in `includes`);
#  - page-sweep.ts:78, 303, 388, 389, 390, 395 sort string sets before `toEqual` comparisons;
#  - harness.ts:65, 69 sort directory listings compared with `toEqual(EXPECTED_MIDDLEWARE)` (routes.sweep.spec.ts:105).
# NOTE for page-sweep.ts: this file-scoped entry would ALSO hide a regression of line 150 (a default `.sort()` on the HTTP status numbers);
# that was accepted, line 150 is covered by the sweep specs and was fixed by hand.
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e9.resourceKey=apps/web/src/app/pages/(app)/orders/place.page.ts
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e10.resourceKey=apps/web/src/app/testing/number-boxes.ts
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e11.resourceKey=apps/web/src/app/testing/page-sweep.ts
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e12.resourceKey=apps/web/src/server/testing/harness.ts

# typescript:S2068 "Review this potentially hard-coded password" (1 issue, bff-contract.ts:306).
# False positive: the literal is the body `username=attacker&password=attackers-own` of a login-CSRF refusal test (the BFF must answer
# 403 before reading it); a fixture of an attacker in a `testing/` file, not a credential of any system.
sonar.issue.ignore.multicriteria.e13.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e13.resourceKey=apps/web/src/server/testing/bff-contract.ts

# typescript:S5332 "Using http protocol is insecure" (1 issue, fake-gateway.ts:46).
# False positive: `new URL(recorded.url, 'http://x')` uses `http://x` only as the base so a relative request URL can be parsed for
# `.pathname`; no connection is made.
sonar.issue.ignore.multicriteria.e14.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e14.resourceKey=apps/web/src/server/testing/fake-gateway.ts
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14

# sonar.host.url and the token are deliberately NOT set here (a token is a secret, a host URL varies by
# environment); scripts/sonar-scan.sh passes them on the command line.
